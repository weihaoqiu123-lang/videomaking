name: Unpack source bundle

on:
  push:
    branches: [portfolio-codex-merge]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and unpack source bundle
        shell: bash
        run: |
          cat bundle.part-* > source_bundle.b64
          base64 -d source_bundle.b64 > source_bundle.zip
          unzip -o source_bundle.zip
          rm -f source_bundle.zip source_bundle.b64 bundle.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Merge Codex portfolio into video task management"
          git push origin HEAD:portfolio-codex-merge
